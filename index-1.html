<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora Arena</title>
<meta name="theme-color" content="#2f3d2a">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e1c8;--paper:#f6f1df;--ink:#1b2419;--olive:#2f3d2a;--flare:#e8412c;--mut:#686d58;--ok:#2f7d4a;--hd:"Saira Stencil One",Impact,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;padding-bottom:76px}
header{background:var(--olive);color:var(--bg);padding:14px 16px;display:flex;align-items:baseline;gap:10px}
header span{font:24px var(--hd);letter-spacing:1px}header small{opacity:.7}
main{padding:14px;max-width:560px;margin:auto}
.card,.tk{background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:14px;margin-bottom:14px}
h3{font:22px/1.2 var(--hd);margin:0 0 4px}
.mut{color:var(--mut);font-size:14px;margin:2px 0}
button,input,select{font:inherit;width:100%;margin-top:8px;padding:11px 12px;border-radius:4px;border:2px solid var(--ink);background:#fffdf3;color:var(--ink)}
button{background:var(--flare);color:#fff;font:18px var(--hd);letter-spacing:.5px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button.alt{background:transparent;color:var(--ink);box-shadow:none}
button:disabled{background:#c9c2a6;color:var(--mut);box-shadow:none}
:focus-visible{outline:3px solid var(--flare);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--olive)}
nav button{margin:0;border:0;border-radius:0;background:none;box-shadow:none;color:#b9c0a4;font:15px var(--hd);padding:16px 4px}
nav button.on{color:#fff;box-shadow:inset 0 -4px 0 var(--flare)}
.tk{position:relative;overflow:hidden}
.tk-top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.mode{background:var(--ink);color:var(--bg);padding:0 10px;border-radius:3px}
.st{color:var(--mut)}.st.Live{color:var(--flare)}
.prize{display:flex;align-items:baseline;gap:8px;margin:10px 0}
.prize b{font:34px var(--hd);color:var(--flare)}.prize em{margin-left:auto;font-style:normal;font-weight:700}
.cells{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin:6px 0}
.cells i{height:8px;background:#d3cbb0}.cells i.f{background:var(--ink)}
.perf{border-top:2px dashed var(--ink);margin:14px -14px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.perf::before{left:-12px}.perf::after{right:-12px}
.room{background:var(--olive);color:var(--bg);border-radius:4px;padding:10px;margin-top:8px}
.room b{font:20px var(--hd);color:#fff}
.ok{font-weight:700;color:var(--ok)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid #cfc7aa;text-align:left}
</style>
</head>
<body>
<header><span>NEXORA ARENA</span><small>Aakhri circle tak</small></header>
<main id="app"></main>
<nav id="nav"></nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
// ====== SETUP: apni Firebase config yahan paste karo ======
const firebaseConfig = {
  apiKey: "AIzaSyAt_4wg-l98Vkcw98m-aRAGv2ODnqSXJ6U",
  authDomain: "nexora-arena-a7d6c.firebaseapp.com",
  projectId: "nexora-arena-a7d6c",
  appId: "1:744518988903:web:5b431b8694b5b318aa10c2"
};
// Firebase -> Project settings -> Cloud Messaging -> Web Push certificates se key
const VAPID = "YOUR_VAPID_KEY";
// Admin ka Google email yahan likho
const ADMINS = ["mohankumaraurangabada@gmail.com"];
// ==========================================================

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me = null, profile = null, tab = "home", isAdmin = false;

auth.onAuthStateChanged(async u => {
  me = u; isAdmin = !!u && ADMINS.includes(u.email);
  if (u) { const d = await db.collection("users").doc(u.uid).get(); profile = d.exists ? d.data() : null; }
  render();
});

function nav() {
  const items = [["home","Matches"],["board","Leaderboard"],["me","Profile"]];
  if (isAdmin) items.push(["admin","Admin"]);
  $("#nav").innerHTML = me ? items.map(([k,l]) => `<button class="${tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("") : "";
}
function go(t) { tab = t; render(); }

async function render() {
  nav();
  const a = $("#app");
  if (!me) { a.innerHTML = `<div class="card"><h3>Swagat hai</h3><p class="mut">Tournament join karne ke liye login karo.</p><button onclick="login()">Google se login karo</button></div>`; return; }
  if (!profile) { a.innerHTML = `<div class="card"><h3>Profile banao</h3><input id="pn" placeholder="In-game naam"><input id="pu" inputmode="numeric" placeholder="Free Fire UID"><button onclick="saveProfile()">Profile save karo</button></div>`; return; }
  if (tab === "home") return home();
  if (tab === "board") return board();
  if (tab === "me") { a.innerHTML = `<div class="card"><h3>${esc(profile.name)}</h3><p class="mut">FF UID: ${esc(profile.ffuid)}<br>${esc(me.email)}</p><button onclick="enablePush()">Notification chalu karo</button><button class="alt" onclick="auth.signOut()">Logout</button></div>`; return; }
  if (tab === "admin") return admin();
}

async function enablePush() {
  try {
    if (!("Notification" in window)) return alert("Is browser mein notification nahi chalte. Chrome use karo ya app ko Home screen par add karo.");
    if (await Notification.requestPermission() !== "granted") return alert("Notification allow karna padega.");
    const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
    const token = await firebase.messaging().getToken({ vapidKey: VAPID, serviceWorkerRegistration: reg });
    await db.collection("users").doc(me.uid).set({ token }, { merge: true });
    alert("Notification chalu ho gaye");
  } catch (e) { alert(e.message); }
}
const login = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert(e.message));

async function saveProfile() {
  const name = $("#pn").value.trim(), ffuid = $("#pu").value.trim();
  if (!name || !ffuid) return alert("Naam aur UID dono daalo");
  profile = { name, ffuid };
  await db.collection("users").doc(me.uid).set(profile);
  render();
}

async function home() {
  $("#app").innerHTML = `<p class="mut">Load ho raha hai...</p>`;
  const snap = await db.collection("tournaments").orderBy("time").get();
  if (snap.empty) { $("#app").innerHTML = `<div class="card">Abhi koi tournament nahi hai. Thodi der baad dekho.</div>`; return; }
  let html = ("Notification" in window && Notification.permission === "default") ? `<div class="card"><h3>Match ki khabar pao</h3><p class="mut">Room ID aur result ki notification chalu karo.</p><button onclick="enablePush().then(home)">Notification chalu karo</button></div>` : "";
  for (const d of snap.docs) {
    const t = d.data(), id = d.id;
    const reg = await db.collection("tournaments").doc(id).collection("regs").doc(me.uid).get();
    const cnt = (await db.collection("tournaments").doc(id).collection("regs").get()).size;
    let room = "";
    if (reg.exists) {
      try { const r = await db.collection("tournaments").doc(id).collection("secret").doc("room").get();
        room = r.exists ? `<div class="room">Room ID: <b>${esc(r.data().id)}</b><br>Password: <b>${esc(r.data().pass)}</b></div>` : `<div class="mut">Room ID match se pehle aayegi.</div>`;
      } catch (e) { room = ""; }
    }
    const left = Math.max(0, +t.slots - cnt);
    const cells = Array.from({length: Math.min(+t.slots, 48)}, (_, i) => `<i class="${i < cnt ? "f" : ""}"></i>`).join("");
    html += `<article class="tk">
      <div class="tk-top"><span class="mode">${esc(t.mode)}</span><span class="st ${esc(t.status)}">${esc(t.status)}</span></div>
      <h3>${esc(t.title)}</h3>
      <p class="mut">Map: ${esc(t.map)}, shuru: ${esc(t.time.replace("T"," "))}</p>
      <div class="prize"><b>₹${esc(t.prize)}</b><span class="mut">prize pool</span><em>Entry ₹${esc(t.fee)}</em></div>
      <div class="cells" role="img" aria-label="${cnt} of ${esc(t.slots)} slots bhare">${cells}</div>
      <p class="mut">${left} slots khali</p>
      <div class="perf"></div>
      ${reg.exists ? `<div class="ok">Aapki seat pakki hai</div>${room}`
        : (left <= 0 ? `<button disabled>Slots full</button>` : `<button onclick="join('${id}')">Seat book karo</button>`)}
    </article>`;
  }
  $("#app").innerHTML = html;
}

async function join(id) {
  const ref = db.collection("tournaments").doc(id).collection("regs").doc(me.uid);
  await ref.set({ name: profile.name, ffuid: profile.ffuid, email: me.email, at: Date.now() });
  home();
}

async function board() {
  const snap = await db.collection("results").get();
  const m = {};
  snap.forEach(d => { const r = d.data(); m[r.name] ??= { pts: 0, kills: 0, n: 0 }; m[r.name].pts += +r.points; m[r.name].kills += +r.kills; m[r.name].n++; });
  const rows = Object.entries(m).sort((a, b) => b[1].pts - a[1].pts);
  $("#app").innerHTML = `<div class="card"><h3>Leaderboard</h3>` + (rows.length
    ? `<table><tr><th>#</th><th>Player</th><th>Kills</th><th>Pts</th></tr>${rows.map(([n, v], i) => `<tr><td>${i + 1}</td><td>${esc(n)}</td><td>${v.kills}</td><td>${v.pts}</td></tr>`).join("")}</table>`
    : `<p class="mut">Abhi koi result nahi hai.</p>`) + `</div>`;
}

async function admin() {
  const ts = await db.collection("tournaments").get();
  const opts = ts.docs.map(d => `<option value="${d.id}">${esc(d.data().title)}</option>`).join("");
  $("#app").innerHTML = `
  <div class="card"><h3>Naya tournament</h3>
    <input id="t1" placeholder="Title"><select id="t2"><option>Solo</option><option>Duo</option><option>Squad</option></select>
    <input id="t3" placeholder="Map (Bermuda)"><input id="t4" type="datetime-local">
    <input id="t5" type="number" placeholder="Entry fee"><input id="t6" type="number" placeholder="Prize pool"><input id="t7" type="number" placeholder="Total slots">
    <button onclick="addT()">Tournament banao</button></div>
  <div class="card"><h3>Room ID / Password</h3><select id="r0">${opts}</select>
    <input id="r1" placeholder="Room ID"><input id="r2" placeholder="Password"><button onclick="setRoom()">Room save karo</button></div>
  <div class="card"><h3>Result daalo</h3><select id="s0">${opts}</select>
    <input id="s1" placeholder="Player ka in-game naam"><input id="s2" type="number" placeholder="Kills"><input id="s3" type="number" placeholder="Placement (1-12)">
    <button onclick="addR()">Result save karo</button><p class="mut">Points = kills + placement points (1st=12, 2nd=9, 3rd=8, 4th=7 ... 12th=1)</p></div>`;
}
async function addT() {
  const g = i => $("#t" + i).value;
  if (!g(1) || !g(4)) return alert("Title aur time daalo");
  await db.collection("tournaments").add({ title: g(1), mode: g(2), map: g(3), time: g(4), fee: +g(5) || 0, prize: +g(6) || 0, slots: +g(7) || 48, status: "Upcoming" });
  alert("Ban gaya"); admin();
}
async function setRoom() {
  await db.collection("tournaments").doc($("#r0").value).collection("secret").doc("room").set({ id: $("#r1").value, pass: $("#r2").value });
  alert("Room save ho gaya");
}
async function addR() {
  const k = +$("#s2").value || 0, p = +$("#s3").value || 12;
  const pp = {1:12,2:9,3:8,4:7,5:6,6:5,7:4,8:3,9:2,10:1,11:1,12:1}[p] ?? 0;
  await db.collection("results").add({ tid: $("#s0").value, name: $("#s1").value.trim(), kills: k, place: p, points: k + pp });
  alert("Result save ho gaya");
}
</script>
</body>
</html>
